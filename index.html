<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Simulador de perguntas para a banca do projeto Organizador Acadêmico.">
    <title>Simulador de Banca — Organizador Acadêmico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="app-shell container d-flex align-items-center min-vh-100 py-4 py-md-5">
        <section id="tela-inicial" class="w-100" aria-labelledby="titulo-principal">
            <header class="hero mx-auto mb-4 mb-md-5 text-center">
                <span class="eyebrow">Projeto Final de Curso</span>
                <h1 id="titulo-principal" class="display-3 fw-bold mt-2 mb-0">Simulador de Banca</h1>
                <p class="project-name fw-semibold mb-0">Organizador Acadêmico</p>
                <p class="text-secondary fs-5 mt-3 mb-0">Escolha um professor para iniciar a simulação</p>
            </header>

            <div class="professor-selection mx-auto" role="radiogroup" aria-label="Selecione um professor">
                <button class="professor-card professor-card--all card w-100 shadow-sm mb-3" type="button" role="radio" aria-checked="false" data-professor="Todos">
                    <span class="card-body d-flex flex-column flex-sm-row align-items-center justify-content-center gap-3 p-4">
                        <span class="professor-card__initials" aria-hidden="true">TP</span>
                        <span class="text-center text-sm-start">
                            <span class="d-block fw-bold fs-5">Todos os professores</span>
                            <span class="d-block text-secondary">Perguntas variadas</span>
                        </span>
                    </span>
                </button>

                <div class="row g-3">
                    <div class="col-12 col-sm-6 col-lg-3">
                        <button class="professor-card card h-100 w-100 shadow-sm" type="button" role="radio" aria-checked="false" data-professor="Bruno">
                            <span class="card-body d-flex flex-column align-items-center justify-content-center p-4">
                                <span class="professor-card__initials mb-3" aria-hidden="true">BR</span>
                                <span class="fw-bold fs-5">Bruno</span>
                                <span class="text-secondary small mt-1">Regras de Negócio</span>
                            </span>
                        </button>
                    </div>
                    <div class="col-12 col-sm-6 col-lg-3">
                        <button class="professor-card card h-100 w-100 shadow-sm" type="button" role="radio" aria-checked="false" data-professor="Léo">
                            <span class="card-body d-flex flex-column align-items-center justify-content-center p-4">
                                <span class="professor-card__initials mb-3" aria-hidden="true">LÉ</span>
                                <span class="fw-bold fs-5">Léo</span>
                                <span class="text-secondary small mt-1">Requisições e Código</span>
                            </span>
                        </button>
                    </div>
                    <div class="col-12 col-sm-6 col-lg-3">
                        <button class="professor-card card h-100 w-100 shadow-sm" type="button" role="radio" aria-checked="false" data-professor="Alessandro">
                            <span class="card-body d-flex flex-column align-items-center justify-content-center p-4">
                                <span class="professor-card__initials mb-3" aria-hidden="true">AL</span>
                                <span class="fw-bold fs-5">Alessandro</span>
                                <span class="text-secondary small mt-1">Arquitetura e Conceitos</span>
                            </span>
                        </button>
                    </div>
                    <div class="col-12 col-sm-6 col-lg-3">
                        <button class="professor-card card h-100 w-100 shadow-sm" type="button" role="radio" aria-checked="false" data-professor="Fabiano">
                            <span class="card-body d-flex flex-column align-items-center justify-content-center p-4">
                                <span class="professor-card__initials mb-3" aria-hidden="true">FA</span>
                                <span class="fw-bold fs-5">Fabiano</span>
                                <span class="text-secondary small mt-1">LGPD e Banco de Dados</span>
                            </span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="d-grid d-sm-block text-center mt-4 mt-md-5">
                <button id="iniciar-simulacao" class="start-button btn btn-primary btn-lg px-sm-5 shadow-sm" type="button" disabled>
                    Iniciar Simulação
                </button>
            </div>
        </section>

        <section id="tela-simulacao" class="w-100 hidden" aria-labelledby="pergunta-atual">
            <div class="simulation-wrapper mx-auto">
                <div class="simulation-toolbar d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
                    <button id="voltar-inicio" class="btn btn-outline-secondary btn-sm" type="button">Voltar ao início</button>
                    <div class="scoreboard d-flex flex-wrap justify-content-end gap-2" aria-label="Placar da simulação" aria-live="polite">
                        <span class="score-badge badge rounded-pill text-bg-light border px-3 py-2">
                            Acertos <strong id="total-acertos" class="text-success ms-1">0</strong>
                        </span>
                        <span class="score-badge badge rounded-pill text-bg-light border px-3 py-2">
                            Erros <strong id="total-erros" class="text-danger ms-1">0</strong>
                        </span>
                    </div>
                </div>

                <article class="question-card card border-0 rounded-4 shadow-lg overflow-hidden">
                    <div class="card-body p-3 p-sm-4 p-md-5">
                        <div class="question-progress d-flex flex-column flex-sm-row align-items-sm-center gap-2 gap-sm-3 mb-4">
                            <span id="progresso-pergunta" class="text-secondary fw-semibold text-nowrap">Pergunta 1 de 1</span>
                            <div class="progress flex-grow-1 w-100" role="progressbar" aria-label="Progresso da simulação">
                                <div id="barra-progresso" class="progress-bar"></div>
                            </div>
                        </div>

                        <div class="question-meta d-flex flex-wrap gap-2 pb-4 border-bottom">
                            <span class="meta-badge badge rounded-pill text-bg-primary px-3 py-2">
                                Professor: <strong id="meta-professor"></strong>
                            </span>
                            <span class="meta-badge badge rounded-pill bg-primary-subtle text-primary-emphasis px-3 py-2">
                                <strong id="meta-categoria"></strong>
                            </span>
                            <span class="meta-badge badge rounded-pill text-bg-secondary px-3 py-2">
                                <strong id="meta-dificuldade"></strong>
                            </span>
                        </div>

                        <div class="mt-4 pt-md-2">
                            <span class="section-label">Pergunta</span>
                            <h2 id="pergunta-atual" class="question-title fw-bold mt-2 mb-0"></h2>
                        </div>

                        <button id="mostrar-resposta" class="btn btn-outline-primary btn-lg w-100 mt-4" type="button">Mostrar resposta</button>

                        <div id="resposta-container" class="answer-panel alert alert-primary border-0 mt-4 mb-0 hidden" aria-live="polite">
                            <span class="section-label">Resposta esperada</span>
                            <p id="resposta-atual" class="mt-2 mb-0"></p>
                        </div>

                        <div id="acoes-avaliacao" class="mt-4 pt-4 border-top hidden">
                            <p class="text-secondary fw-semibold mb-3">Como foi sua resposta?</p>
                            <div class="evaluation-grid row g-2">
                                <div class="col-6 col-md-3">
                                    <button id="marcar-erro" class="button--wrong btn btn-danger w-100" type="button">Não sei</button>
                                </div>
                                <div class="col-6 col-md-3">
                                    <button id="marcar-acerto" class="button--correct btn btn-success w-100" type="button">Acertei</button>
                                </div>
                                <div class="col-12 col-md-6">
                                    <button id="proxima-pergunta" class="btn btn-primary w-100" type="button" disabled>Próxima pergunta</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </article>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/perguntas.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
